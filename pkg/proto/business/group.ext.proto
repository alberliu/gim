syntax = "proto3";
package business;
option go_package = "gim/pkg/gen/proto/businesspb";

import "google/protobuf/empty.proto";
import "logic/group.int.proto";

service GroupExtService {
  // 创建群组
  rpc Create (logic.GroupCreateRequest) returns (logic.GroupCreateReply);
  // 获取群组信息
  rpc Get (logic.GroupGetRequest) returns (logic.GroupGetReply);
}
