kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # mysql
      - containerPort: 3306
        hostPort: 3306
        protocol: TCP
      # redis
      - containerPort: 6379
        hostPort: 6379
        protocol: TCP
      # connect: gRPC/TCP/WebSocket
      - containerPort: 8002
        hostPort: 8002
        protocol: TCP
      - containerPort: 8003
        hostPort: 8003
        protocol: TCP
      # proxy
      - containerPort: 8080
        hostPort: 8080
        protocol: TCP
    extraMounts:
      - hostPath: /etc/localtime
        containerPath: /etc/localtime
        readOnly: true
      - hostPath: /Users/alber/data/gim_cluster
        containerPath: /data
