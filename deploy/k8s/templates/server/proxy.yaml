# deployment 配置
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-deployment
  labels:
    app: {{ .Values.server.proxy.name }}
spec:
  replicas: {{ .Values.server.proxy.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.server.proxy.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.server.proxy.name }}
    spec:
      initContainers:
        - name: init-mysql
          image: busybox:1.28
          imagePullPolicy: IfNotPresent
          command: [ 'sh', '-c', "until nslookup mysql-stateful-set-0.mysql.default.svc.cluster.local; do echo waiting for mysql; sleep 1; done" ]
        - name: init-redis
          image: busybox:1.28
          imagePullPolicy: IfNotPresent
          command: [ 'sh', '-c', "until nslookup redis-stateful-set-0.redis.default.svc.cluster.local; do echo waiting for redis; sleep 1; done" ]
      containers:
        - name: {{ .Values.server.proxy.name }}
          image: {{ .Values.server.proxy.image }}
          imagePullPolicy: IfNotPresent     # 在kind中需要指定，不然会强制到远程拉取镜像，导致部署失败
          ports:
            - containerPort: 8080
              hostPort: 8080
          volumeMounts:
            - mountPath: /data/log/proxy
              name: log
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: ENV
              value: {{ $.Values.env }}
            - name: SERVER
              value: {{ $.Values.server.proxy.name }}
      volumes:
        - name: log
          hostPath:
            path: /data/log/proxy
---
# service 配置
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.server.proxy.name }}
  labels:
    app: {{ .Values.server.proxy.name }}
spec:
  selector:
    app: {{ .Values.server.proxy.name }}
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
