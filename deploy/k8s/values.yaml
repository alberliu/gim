env: k8s

# mysql存储大小
mysqlStorage: 50Gi

# redis存储大小
redisStorage: 50Gi

server:
  connect:
    name: connect
    image: connect:0.0.0
    replicas: 1
  logic:
    name: logic
    image: logic:0.0.0
    replicas: 1
  business:
    name: business
    image: business:0.0.0
    replicas: 1
  proxy:
    name: proxy
    image: proxy:0.0.0
    replicas: 1