# 本地开发环境
name: gim

services:
  mysql:
    container_name: mysql
    restart: always
    image: mysql:8.0.43
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      ENV: compose
    volumes:
      - /etc/localtime:/etc/localtime
      - /Users/alber/data/gim_compose/mysql:/var/lib/mysql
      - ./my.cnf:/etc/mysql/conf.d/my.cnf
      - ../../sql:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"

  redis:
    container_name: redis
    restart: always
    image: redis:7.4.2
    volumes:
      - /etc/localtime:/etc/localtime
      - ./redis.conf:/etc/redis.conf
      - /Users/alber/data/gim_compose/redis:/data
    command:
      redis-server /etc/redis.conf
    ports:
      - "6379:6379"
    environment:
      ENV: compose

  connect:
    container_name: connect
    restart: always
    image: connect:20260423.162905
    volumes:
      - /etc/localtime:/etc/localtime
      - /Users/alber/data/gim_compose/log/connect:/data/log/connect
    ports:
      - "8000:8000"
      - "8002:8002"
      - "8003:8003"
    environment:
      ENV: compose
      SERVER: connect

    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started

  logic:
    container_name: logic
    restart: always
    image: logic:20260423.162917
    volumes:
      - /etc/localtime:/etc/localtime
      - /Users/alber/data/gim_compose/log/logic:/data/log/logic
    ports:
      - "8010:8000"
    environment:
      ENV: compose
      SERVER: logic
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started

  business:
    container_name: business
    restart: always
    image: business:20260423.162922
    volumes:
      - /etc/localtime:/etc/localtime
      - /Users/alber/data/gim_compose/log//business:/data/log/business
    ports:
      - "8020:8000"
    environment:
      ENV: compose
      SERVER: business
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started

  file:
    container_name: file
    restart: always
    image: file:20260423.162925
    volumes:
      - /etc/localtime:/etc/localtime
      - /Users/alber/data/gim_compose/file:/data/file
      - /Users/alber/data/gim_compose/log/file:/data/log/file
    ports:
      - "8031:8001"
    environment:
      ENV: compose
      SERVER: file
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started